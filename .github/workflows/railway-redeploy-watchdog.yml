name: Railway Deploy Watchdog

# Rede de seguranca pro caso do Railway cair bem na hora de um push/merge em
# main: o deploy automatico nativo (webhook Railway -> build) depende do
# Railway estar no ar pra disparar, e o retry do GitHub nao e garantido.
# Este workflow roda em paralelo, de forma independente: a cada 10 minutos,
# checa se o Railway esta no ar e se o commit mais recente de main ainda nao
# foi disparado por aqui — se não foi, dispara via API GraphQL do Railway.
# workflow_dispatch permite rodar manualmente (ex: logo depois de confirmar
# que o Railway voltou, sem esperar o próximo tick do cron).
#
# Token de PROJETO do Railway (Project Settings -> Tokens) — usa o header
# "Project-Access-Token", nao "Authorization: Bearer" (esse e so pra token
# de conta/workspace). Confirmado com a query `projectToken { projectId
# environmentId }` (docs.railway.com/reference/public-api).
#
# serviceId/environmentId deste projeto nao sao segredo (aparecem na URL do
# dashboard) — fixos aqui direto, so o token precisa ser secret.
#
# Mutation serviceInstanceDeployV2(serviceId, environmentId, commitSha) —
# confirmada em uso real (comunidade Railway + pipeline de outro projeto),
# mas sem documentação oficial estável pra essa mutation especifica.
# Recomenda-se um dry run manual (workflow_dispatch) antes de confiar
# 100% nisso.
#
# Notificacao via WhatsApp (WPPConnect, mesmo servidor usado pelo
# digitalrf-help) so dispara quando um redeploy foi de fato tentado nesse
# run (sucesso ou falha) — nunca nos ticks de 10min sem nada a fazer.
# Precisa de secrets/vars no GitHub (Settings -> Secrets and variables ->
# Actions):
#   - secrets.RAILWAY_TOKEN          (token de projeto do Railway)
#   - secrets.WPPCONNECT_SECRET_KEY  (chave do WPPConnect, aba "Variables")
#   - vars.WPPCONNECT_URL            (ex: https://wppconnect-server-...up.railway.app)
#   - vars.WPPCONNECT_INSTANCE       (nome da sessao, ex: DRF)
#   - vars.WPPCONNECT_NOTIFY_PHONE   (numero com DDI, so digitos, ex: 55DDDNUMERO)

on:
  # schedule:
  #   - cron: '*/10 * * * *'
  workflow_dispatch: {}

env:
  RAILWAY_SERVICE_ID: 6495bcd1-b7c9-4a08-b280-ce50fc2ed4cd
  RAILWAY_ENVIRONMENT_ID: b69e38dc-7927-46a9-b93c-ce7cf40a7872

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checa se a API do Railway esta no ar
        id: ping
        run: |
          RESP=$(curl -s --max-time 10 \
            https://backboard.railway.com/graphql/v2 \
            -X POST -H "Content-Type: application/json" \
            -H "Project-Access-Token: ${{ secrets.RAILWAY_TOKEN }}" \
            -d '{"query":"query { projectToken { projectId environmentId } }"}')
          echo "Resposta do Railway: $RESP"
          if echo "$RESP" | jq -e '.data.projectToken.environmentId' > /dev/null 2>&1; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restaura o ultimo commit ja disparado por este watchdog
        if: steps.ping.outputs.up == 'true'
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .railway-watchdog-last-sha
          key: railway-watchdog-last-sha-${{ github.sha }}
          restore-keys: |
            railway-watchdog-last-sha-

      - name: Dispara deploy se o commit atual ainda nao foi tratado
        if: steps.ping.outputs.up == 'true'
        id: deploy
        run: |
          LAST=""
          [ -f .railway-watchdog-last-sha ] && LAST=$(cat .railway-watchdog-last-sha)
          CURRENT="${{ github.sha }}"

          if [ "$LAST" = "$CURRENT" ]; then
            echo "Commit $CURRENT ja foi disparado por este watchdog antes — nada a fazer."
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Disparando deploy do commit $CURRENT no Railway..."
          BODY=$(jq -n \
            --arg s "$RAILWAY_SERVICE_ID" \
            --arg e "$RAILWAY_ENVIRONMENT_ID" \
            --arg c "$CURRENT" \
            '{query:"mutation($s:String!,$e:String!,$c:String!){ serviceInstanceDeployV2(serviceId:$s, environmentId:$e, commitSha:$c) }", variables:{s:$s,e:$e,c:$c}}')

          RESP=$(curl -s https://backboard.railway.com/graphql/v2 \
            -H "Content-Type: application/json" \
            -H "Project-Access-Token: ${{ secrets.RAILWAY_TOKEN }}" \
            -d "$BODY")
          echo "$RESP"

          if echo "$RESP" | jq -e '.errors' > /dev/null 2>&1; then
            echo "Railway retornou erro ao disparar o deploy — não marca como tratado, tenta de novo no próximo tick."
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "$CURRENT" > .railway-watchdog-last-sha
          echo "triggered=true" >> "$GITHUB_OUTPUT"

      - name: Salva o commit tratado no cache
        if: steps.ping.outputs.up == 'true' && steps.deploy.outputs.triggered == 'true'
        uses: actions/cache/save@v4
        with:
          path: .railway-watchdog-last-sha
          key: railway-watchdog-last-sha-${{ github.sha }}

      # Avisa via WhatsApp (WPPConnect) só quando um deploy foi de fato
      # disparado agora, ou quando a tentativa falhou — nunca nos ticks de
      # 10min em que não havia nada novo pra fazer (senão vira spam).
      - name: Notifica resultado via WhatsApp
        if: always() && steps.ping.outputs.up == 'true' && (steps.deploy.outputs.triggered == 'true' || steps.deploy.outcome == 'failure')
        run: |
          if [ "${{ steps.deploy.outcome }}" = "failure" ]; then
            MSG="Railway Deploy Watchdog: FALHOU ao tentar redeploy do commit ${{ github.sha }} em ${{ github.repository }}. Veja os logs no GitHub Actions."
          else
            MSG="Railway Deploy Watchdog: deploy do commit ${{ github.sha }} disparado com sucesso em ${{ github.repository }}."
          fi

          TOKEN=$(curl -s -X POST \
            "${{ vars.WPPCONNECT_URL }}/api/${{ vars.WPPCONNECT_INSTANCE }}/${{ secrets.WPPCONNECT_SECRET_KEY }}/generate-token" \
            -H "Content-Type: application/json" | jq -r '.token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Nao foi possivel gerar token do WPPConnect, aviso nao enviado."
            exit 0
          fi

          curl -s -X POST "${{ vars.WPPCONNECT_URL }}/api/${{ vars.WPPCONNECT_INSTANCE }}/send-message" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d "$(jq -n --arg m "$MSG" --arg p "${{ vars.WPPCONNECT_NOTIFY_PHONE }}" '{phone:$p, message:$m, isGroup:false}')"
